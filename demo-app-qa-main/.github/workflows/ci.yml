name: CI

# Full quality pipeline for the Insurance Claims demo.
#
# Stages (jobs): backend unit -> frontend unit + typecheck + build ->
# Testcontainers integration -> Pact consumer -> Pact provider -> Playwright E2E
# -> k6 smoke. Performance stress testing is intentionally NOT a gate.
#
# Notes:
#  - Integration / Pact-provider / E2E jobs require Docker (available on
#    GitHub-hosted ubuntu runners) and start the application stack.
#  - The test JVM is pinned to UTC (configured in each pom's surefire plugin) for
#    deterministic tests and PostgreSQL timezone compatibility.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_stress:
        description: "Also run the k6 stress profile (non-gating)"
        type: boolean
        default: false

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [claims-service, bff-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Unit tests (${{ matrix.service }})
        working-directory: code/${{ matrix.service }}
        run: mvn -B test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-${{ matrix.service }}
          path: code/${{ matrix.service }}/target/surefire-reports/

  frontend-unit:
    name: Frontend unit, typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/demo-app-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: code/demo-app-ui/package-lock.json
      - run: npm ci
      - name: Unit tests (Vitest)
        run: npm run test
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  integration-tests:
    name: Testcontainers integration
    runs-on: ubuntu-latest
    needs: backend-unit
    strategy:
      matrix:
        service: [claims-service, bff-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Integration tests (${{ matrix.service }})
        working-directory: code/${{ matrix.service }}
        run: mvn -B test "-Dsurefire.excludedGroups=" "-Dgroups=integration"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-${{ matrix.service }}
          path: code/${{ matrix.service }}/target/surefire-reports/

  pact-consumer:
    name: Pact consumer (BFF)
    runs-on: ubuntu-latest
    needs: backend-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Generate consumer pact
        working-directory: code/bff-service
        run: mvn -B test "-Dtest=ClaimsServiceConsumerPactTest"
      - name: Upload pact
        uses: actions/upload-artifact@v4
        with:
          name: pacts
          path: code/bff-service/pacts/

  pact-provider:
    name: Pact provider verification (Claims)
    runs-on: ubuntu-latest
    needs: pact-consumer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Download pact from consumer job
        uses: actions/download-artifact@v4
        with:
          name: pacts
          path: code/claims-service/src/test/resources/pacts/
      - name: Verify provider against pact
        working-directory: code/claims-service
        run: mvn -B test "-Dsurefire.excludedGroups=" "-Dgroups=integration" "-Dtest=ClaimsServiceProviderPactTest"

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [frontend-unit, backend-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: code/demo-app-ui/package-lock.json
      - name: Start infrastructure + backend services
        run: |
          docker compose -f docker-compose.infra.yml up -d
          docker compose -f docker-compose.apps.yml up -d
      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && \
            curl -sf http://localhost:8090/actuator/health && break
            sleep 5
          done
      - name: Install UI deps & Playwright browsers
        working-directory: code/demo-app-ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build & start UI (prod, port 3101)
        working-directory: code/demo-app-ui
        run: |
          npm run build
          nohup npx next start -p 3101 &
          for i in $(seq 1 30); do curl -sf http://localhost:3101 && break; sleep 2; done
      - name: Run Playwright
        working-directory: code/demo-app-ui
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: code/demo-app-ui/playwright-report/

  k6-smoke:
    name: k6 smoke (performance)
    runs-on: ubuntu-latest
    needs: e2e
    steps:
      - uses: actions/checkout@v4
      - name: Start infrastructure + backend services
        run: |
          docker compose -f docker-compose.infra.yml up -d
          docker compose -f docker-compose.apps.yml up -d
      - name: Wait for BFF health
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8090/actuator/health && break; sleep 5; done
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      - name: k6 smoke test
        run: k6 run --summary-export performance/k6/results/smoke-summary.json performance/k6/smoke-test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-smoke-summary
          path: performance/k6/results/smoke-summary.json

  # Optional, manual, NON-gating stress profile.
  k6-stress:
    name: k6 stress (optional, non-gating)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_stress }}
    needs: k6-smoke
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Start infrastructure + backend services
        run: |
          docker compose -f docker-compose.infra.yml up -d
          docker compose -f docker-compose.apps.yml up -d
      - name: Wait for BFF health
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8090/actuator/health && break; sleep 5; done
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      - name: k6 stress test
        run: k6 run performance/k6/stress-test.js
